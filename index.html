<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stephann Card Game – Fixed Empty Table</title>
<style>
  body { font-family: Arial, sans-serif; background:#f8f8f8; padding:20px; }
  #game { max-width:700px; margin:auto; background:#fff; padding:15px; border-radius:8px; box-shadow:0 0 5px #aaa; }
  .hand, .table { margin:10px 0; }
  button { margin:3px; padding:6px 10px; cursor:pointer; }
  .highlight { background:#ffd966; }
  #log { margin-top:15px; background:#eee; padding:10px; height:150px; overflow-y:auto; border-radius:5px; }
  .table, .hand {
    margin: 10px 0;
    display: flex;
    flex-wrap: wrap;    /* allows wrapping if too many cards */
    gap: 6px;           /* space between cards */
  }

  .card {
    padding: 10px;
    width: 80px;
    height: 100px;
    border-radius: 8px;
    box-shadow: 0 0 3px #666;
    color: #fff;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
  }

.Red { background: #ff4d4d; }
.Blue { background: #4da6ff; }
.Green { background: #4dff88; color: #000; }
.Black { background: #333; }
.figure { background: gold; color: #000; }
.spell { background: purple; }
.highlight { outline: 4px solid #ffd966; }

</style>
</head>
<div id="game">
  <div id="setup" style="text-align:center;">
    <h2>Stephann Card Game</h2>
    <p><strong>Select Number of Players:</strong></p>
    <select id="playerCount">
      <option value="2">2 Players</option>
      <option value="3">3 Players</option>
      <option value="4" selected>4 Players</option>
    </select>
    <button onclick="startGame()">Start Game</button>
  </div>

  <div id="playArea" style="display:none;">
    <div id="currentPlayerBox" style="
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      padding: 8px;
      margin-bottom: 10px;
      border-radius: 6px;
      background: #ffd966;">
      Current Player: <span id="currentPlayer">1</span>
    </div>
    <p><strong>Table Cards:</strong></p>
    <div class="table" id="table"></div>
    <p><strong>Your Hand:</strong></p>
    <div class="hand" id="hand"></div>
    <button onclick="endTurnDrop()">Drop (if no capture possible)</button>
    <div id="log"></div>
  </div>
</div>



<script>
let deck = [];
let tableCards = [];
let players = [];


let currentPlayer = 0;
let direction = 1;
let blockedPlayer = false;
let selectedHandIndex = null;
let waitingForSpecialSelection = false;


const colors = ["Red", "Blue", "Green", "Black"];
function generateNumberCards() {
  let cards = [];
  colors.forEach(c => {
    for (let i=1; i<=12; i++) {
      cards.push({ name: i.toString(), type: "number", color: c, value: i });
    }
  });
  return cards;
}
const nonNumberCards = [
  ...Array(5).fill({ name:"Figure1", type:"figure", effect:"universal" }),
  ...Array(5).fill({ name:"Figure2", type:"figure", effect:"thirteen" }),
  ...Array(3).fill({ name:"Spell1", type:"spell", effect:"blocker" }),
  ...Array(4).fill({ name:"Spell2", type:"spell", effect:"reverse" })
];

function shuffle(array){
  for(let i=array.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [array[i],array[j]]=[array[j],array[i]];
  }
}
function formatCard(card){
  return card.type==="number"?`${card.name} (${card.color})`:card.name;
}

function startGame() {
  let count = parseInt(document.getElementById("playerCount").value);

  // Initialize players dynamically
  players = [];
  for (let i = 1; i <= count; i++) {
    players.push({ name: `Player ${i}`, hand: [], setAside: [] });
  }

  // Transition from setup to game
  document.getElementById("setup").style.display = "none";
  document.getElementById("playArea").style.display = "block";

  // Standard setup
  deck = generateNumberCards().concat(JSON.parse(JSON.stringify(nonNumberCards)));
  shuffle(deck);
  players.forEach(p => { p.hand = []; p.setAside = []; });
  for (let i = 0; i < 7; i++) players.forEach(p => p.hand.push(deck.pop()));
  tableCards = [deck.pop(), deck.pop(), deck.pop(), deck.pop()];
  currentPlayer = 0;
  direction = 1;
  blockedPlayer = false;
  selectedHandIndex = null;
  waitingForSpecialSelection = false;
  log("Game started with " + count + " players!");
  updateUI();
}



function updateUI() {
  document.getElementById("currentPlayer").innerText = currentPlayer + 1;

  // --- Table Cards ---
  let tableDiv = document.getElementById("table");
  tableDiv.innerHTML = "";
  tableCards.forEach((card, i) => {
    let div = document.createElement("div");
    div.className = "card " + getCardClass(card);
    div.innerText = formatCard(card);
    div.onclick = () => chooseTableTarget(i);
    if (selectedHandIndex !== null && isValidTarget(players[currentPlayer].hand[selectedHandIndex], card)) {
      div.classList.add("highlight");
    }
    tableDiv.appendChild(div);
  });

  // --- Hand Cards ---
  let handDiv = document.getElementById("hand");
  handDiv.innerHTML = "";
  players[currentPlayer].hand.forEach((card, i) => {
    let div = document.createElement("div");
    div.className = "card " + getCardClass(card);
    div.innerText = formatCard(card);
    if (selectedHandIndex === i) div.classList.add("highlight");
    div.onclick = () => selectHandCard(i);
    handDiv.appendChild(div);
  });
}

// --- NEW: Card Styling Helper ---
function getCardClass(card) {
  if (card.type === "number") return card.color;
  if (card.type === "figure") return "figure";
  if (card.type === "spell") return "spell";
  return "";
}

function log(msg){
  let logDiv=document.getElementById("log");
  logDiv.innerHTML+=msg+"<br>";
  logDiv.scrollTop=logDiv.scrollHeight;
}

function selectHandCard(index){
  let card=players[currentPlayer].hand[index];

  // --- NEW RULE: Empty Table Force Drop ---
  if(tableCards.length===0){
    tableCards.push(card);
    players[currentPlayer].hand.splice(index,1);
    log(`${players[currentPlayer].name} was forced to drop ${formatCard(card)} on an empty table`);
    // Also flip 1 card from the deck to refill
    for (let i = 0; i < 2 && deck.length > 0; i++) {
      let flipped = deck.pop();
      tableCards.push(flipped);
      log(`A card from the deck was added to the table: ${formatCard(flipped)}`);
    }


    endTurn();
    return;
  }

  if(blockedPlayer && card.type==="number"){
    log("You are blocked and cannot capture!");
    return;
  }

  if(card.type==="number"){
    selectedHandIndex=index;
    updateUI();
  } else {
    playSpecialCard(card,index);
    endTurn();
  }
}

function isValidTarget(handCard,tableCard){
  if(tableCard.type!=="number") return true;
  return tableCard.color===handCard.color || tableCard.name===handCard.name;
}

function chooseTableTarget(tableIndex){
  if(selectedHandIndex===null) return;
  let handCard=players[currentPlayer].hand[selectedHandIndex];
  if(!isValidTarget(handCard,tableCards[tableIndex])) {
    log("Invalid target.");
    return;
  }
  takeFromTable(tableIndex,handCard);
  players[currentPlayer].setAside.push(handCard);
  players[currentPlayer].hand.splice(selectedHandIndex,1);
  selectedHandIndex=null;
  endTurn();
}

function takeFromTable(index,card){
  let taken=tableCards.splice(index,1)[0];
  players[currentPlayer].setAside.push(taken);
  log(`${players[currentPlayer].name} captured ${formatCard(taken)} with ${formatCard(card)}`);
}

function playSpecialCard(card, index) {
  switch (card.effect) {
    case "universal":
      if (tableCards.length > 0) {
        selectedHandIndex = index;
        waitingForSpecialSelection = true; // ✅ Pause the normal turn flow
        log(`${players[currentPlayer].name}, click a table card to take with Universal Grabber.`);
        waitForSpecialSelection(card, "universal");
        return;
      }
      break;

    case "thirteen":
      let combo = findThirteenCombo();
      if (combo.length > 0) {
        combo.forEach(i => {
          let taken = tableCards.splice(i, 1)[0];
          players[currentPlayer].setAside.push(taken);
        });
        log(`${players[currentPlayer].name} used 13 Collector and took ${combo.length} cards`);
      } else if (tableCards.length > 0) {
        selectedHandIndex = index;
        waitingForSpecialSelection = true; // ✅ Pause the normal turn flow
        log(`${players[currentPlayer].name}, click a table card to take with 13 Collector.`);
        waitForSpecialSelection(card, "thirteen");
        return;
      }
      break;



    case "blocker":
      blockedPlayer = true;
      log(`${players[currentPlayer].name} played Blocker – next player cannot capture!`);
      break;

    case "reverse":
      direction *= -1;
      log(`${players[currentPlayer].name} played Reverse – turn order changed!`);
      break;
  }

  players[currentPlayer].setAside.push(card);
  players[currentPlayer].hand.splice(index, 1);
  endTurn();
}
function waitForSpecialSelection(card, type) {
  const oldChoose = chooseTableTarget;
  chooseTableTarget = (tableIndex) => {
    let taken = tableCards.splice(tableIndex, 1)[0];
    players[currentPlayer].setAside.push(taken);
    log(`${players[currentPlayer].name} used ${type === "universal" ? "Universal Grabber" : "13 Collector"} on ${formatCard(taken)}`);

    // Restore click behavior
    chooseTableTarget = oldChoose;

    // Move special card to setAside
    players[currentPlayer].setAside.push(card);
    players[currentPlayer].hand.splice(selectedHandIndex, 1);
    selectedHandIndex = null;

    waitingForSpecialSelection = false; // ✅ Now we can continue turns
    endTurn();
  };
}




function findThirteenCombo(){
  for(let i=0;i<tableCards.length;i++){
    for(let j=i+1;j<tableCards.length;j++){
      if((tableCards[i].value||0)+(tableCards[j].value||0)===13) return [j,i].sort((a,b)=>b-a);
    }
  }
  return [];
}

function endTurnDrop(){
  let card=players[currentPlayer].hand.shift();
  if(card){
    if(card.type==="number"){
      tableCards.push(card);
      log(`${players[currentPlayer].name} dropped ${formatCard(card)} on the table`);
    } else {
      if(tableCards.length===0){
        tableCards.push(card);
        log(`${players[currentPlayer].name} was forced to drop ${formatCard(card)} on an empty table`);
        if(deck.length>0){
          let flipped = deck.pop();
          tableCards.push(flipped);
          log(`A card from the deck was added to the table: ${formatCard(flipped)}`);
        }
      } else {
        playSpecialCard(card,0);
      }
    }
  }
  endTurn();
}

function endTurn() {
  if (waitingForSpecialSelection) return; // ✅ Stop until special action is done
  drawCard();
  if (deck.length === 0 && tableCards.length === 0) { endGame(); return; }
  currentPlayer = (currentPlayer + direction + players.length) % players.length;
  if (blockedPlayer) blockedPlayer = false;
  selectedHandIndex = null;
  updateUI();
}


function drawCard(){
  if(deck.length>0) players[currentPlayer].hand.push(deck.pop());
}

function endGame(){
  log("Game ended! Counting points...");
  let scores=players.map(p=>p.setAside.length);
  let max=Math.max(...scores);
  let winners=players.filter(p=>p.setAside.length===max);
  if(winners.length===1){
    alert(`${winners[0].name} wins with ${max} cards!`);
  } else {
    let maxNon=Math.max(...winners.map(p=>p.setAside.filter(c=>c.type!=="number").length));
    let winner=winners.find(p=>p.setAside.filter(c=>c.type!=="number").length===maxNon);
    alert(`${winner.name} wins on tiebreaker with ${maxNon} non-number cards!`);
  }
}

</script>
</body>
</html>
